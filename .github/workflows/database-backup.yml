name: MongoDB Database Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB Database Tools
        run: |
          curl -LO https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb
          sudo apt-get install -y ./mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          rm -rf aws awscliv2.zip

      - name: Create MongoDB backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mkdir -p backups

          TIMESTAMP=$(date -u +"%Y-%m-%d-%H-%M-%S")
          BACKUP_FILE="soraxi-${TIMESTAMP}.archive.gz"

          mongodump \
            --uri="$MONGODB_URI" \
            --archive="backups/${BACKUP_FILE}" \
            --gzip

          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"

      - name: Upload backup to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp \
            "backups/${BACKUP_FILE}" \
            "s3://${R2_BUCKET}/${BACKUP_FILE}" \
            --endpoint-url "${R2_ENDPOINT}"

      - name: Verify backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          echo "Verifying ${BACKUP_FILE}..."

          aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${BACKUP_FILE}" \
            --endpoint-url "${R2_ENDPOINT}"

          echo "Backup verified successfully."
